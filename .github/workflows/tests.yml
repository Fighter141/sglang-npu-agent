name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    # ubuntu-latest (26.04) has no setup-python build for our Python 3.9 minimum.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated CPU regression tests
        run: python -m unittest discover -s tests -v
      - name: Check installer source bundle
        run: python scripts/install.py doctor
